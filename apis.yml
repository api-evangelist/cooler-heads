description: 'Cooler Heads Care, Inc. is a San Diego medical device company founded
  in 2018 by Kate Dilligan that makes Amma, an FDA-cleared Portable Scalp Cooling
  System (PSCS) used to reduce chemotherapy-induced hair loss. Amma circulates chilled
  fluid through a fitted cap to constrict scalp blood vessels and limit chemotherapy
  delivery to hair follicles, and is designed to be portable enough that patients can
  keep cooling outside the infusion chair. The company sells to infusion centers and
  oncology practices and publishes patient, provider, reimbursement and training material
  on its own site. It ships no developer API, SDK or public API documentation; its only
  machine-readable public surface is the Wix-platform site MCP endpoint and llms.txt
  served from its own host.'
