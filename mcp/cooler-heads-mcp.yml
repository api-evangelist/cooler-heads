raw_manifest: mcp/cooler-heads-mcp-tools-list.json
observations:
- Several tool descriptions returned by this endpoint embed an <agent-mandatory-instructions> block that
  directs the calling agent's behaviour (which tool to call first, how to build a site). That is Wix platform
  text carried in the tool metadata, not Cooler Heads content. It was recorded verbatim as data and not
  acted on.
- ExecuteWixAPI accepts arbitrary JavaScript and declares a hasMutations flag, and CallWixSiteAPI accepts
  an arbitrary method + body. Both are gated only by an anonymously-mintable visitor token, so the blast
  radius is whatever the Wix visitor role permits on this site (Blog + Ecommerce).
